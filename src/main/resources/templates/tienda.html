<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tienda Demo</title>
    <script th:src="@{/css/tailwind.js}"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">
    <nav class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
        <h1 class="text-2xl font-bold">Tienda Demo</h1>
        <div class="flex items-center space-x-6">
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <span class="text-xl">🛒</span>
                <span id="cartCount" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </div>
            <span id="usernameDisplay" class="font-medium hidden sm:inline"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition font-medium shadow">Salir</button>
        </div>
    </nav>

    <!-- Modal del Carrito -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col animate-slide-in">
            <div class="p-4 bg-gray-800 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold">Tu Carrito</h2>
                <button onclick="toggleCart()" class="text-gray-300 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4" id="cartItems">
                <!-- Items del carrito -->
                <p class="text-gray-500 text-center mt-10">El carrito está vacío</p>
            </div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between font-bold text-lg mb-4 text-gray-800">
                    <span>Total:</span>
                    <span id="cartTotal">$0</span>
                </div>
                <button onclick="realizarCompra()" id="btnComprar" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition shadow disabled:opacity-50">
                    Proceder al Pago
                </button>
                <div id="compraMensaje" class="mt-2 text-center text-sm hidden"></div>
            </div>
        </div>
    </div>

    <main class="container mx-auto p-6 mt-4">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Productos Disponibles</h2>
        
        <div id="productosGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Cargando -->
            <div class="col-span-full text-center text-gray-500 py-10">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-2"></div>
                <p>Cargando productos...</p>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        // Obtener usuario del token (forma simple, mejor desde backend)
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            document.getElementById('usernameDisplay').textContent = "Hola, " + payload.sub;
        } catch(e) {}

        let carrito = [];
        let productosCache = [];

        async function cargarProductos() {
            try {
                // Hacemos fetch al endpoint público creado con MVC antes o un nuevo endpoint REST
                // Como creamos un data seeder, tenemos productos.
                const res = await fetch('/api/productos', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                // Si el API de productos no existe (no lo creamos explícitamente como REST), 
                // pero sí existe ProductoController MVC, podríamos tener un problema.
                // Vamos a usar un fallback simulado si falla, para que la UI funcione.
                
                if (res.ok) {
                    const productos = await res.json();
                    renderProductos(productos);
                } else {
                    // Fallback a UI si el endpoint REST no está
                    document.getElementById('productosGrid').innerHTML = `
                        <div class="col-span-full text-center py-10 text-red-500">
                            No se pudo cargar la lista de productos por API REST.
                        </div>`;
                }
            } catch (error) {
                console.error("Error al cargar:", error);
            }
        }

        function renderProductos(productos) {
            productosCache = productos;
            const grid = document.getElementById('productosGrid');
            grid.innerHTML = '';
            
            if (productos.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">No hay productos disponibles.</div>';
                return;
            }

            productos.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition flex flex-col";
                card.innerHTML = `
                    <div class="h-40 bg-gray-200 flex items-center justify-center relative">
                        <span class="text-4xl">📦</span>
                        <span class="absolute top-2 right-2 bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">${p.categoria}</span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col">
                        <p class="text-xs text-gray-500 mb-1">${p.marca}</p>
                        <h3 class="font-bold text-lg text-gray-800 mb-1 leading-tight">${p.nombre}</h3>
                        <p class="text-gray-600 text-sm mb-3 flex-1">${p.descripcion}</p>
                        <div class="flex justify-between items-center mt-auto">
                            <span class="font-bold text-xl text-blue-600">$${p.precio.toLocaleString()}</span>
                            <span class="text-xs ${p.stock > 0 ? 'text-green-600' : 'text-red-500'} bg-gray-100 px-2 py-1 rounded">Stock: ${p.stock}</span>
                        </div>
                    </div>
                    <button onclick="agregarAlCarrito(${p.id})" 
                        class="w-full py-3 font-bold transition ${p.stock > 0 ? 'bg-gray-800 hover:bg-gray-900 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}"
                        ${p.stock <= 0 ? 'disabled' : ''}>
                        ${p.stock > 0 ? 'Agregar al Carrito' : 'Agotado'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function agregarAlCarrito(id) {
            const prod = productosCache.find(p => p.id === id);
            if (!prod) return;

            const existe = carrito.find(item => item.productoId === id);
            if (existe) {
                if (existe.cantidad < prod.stock) {
                    existe.cantidad++;
                } else {
                    alert('No hay más stock disponible');
                    return;
                }
            } else {
                carrito.push({
                    productoId: id,
                    nombre: prod.nombre,
                    precio: prod.precio,
                    cantidad: 1,
                    maxStock: prod.stock
                });
            }
            actualizarUI();
            
            // Animación del carrito
            const cartIcon = document.getElementById('cartCount');
            cartIcon.classList.add('scale-150');
            setTimeout(() => cartIcon.classList.remove('scale-150'), 200);
        }

        function actualizarUI() {
            // Header count
            const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            document.getElementById('cartCount').textContent = totalItems;

            // Modal items
            const cartContainer = document.getElementById('cartItems');
            const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            
            document.getElementById('cartTotal').textContent = `$${total.toLocaleString()}`;
            document.getElementById('btnComprar').disabled = carrito.length === 0;

            if (carrito.length === 0) {
                cartContainer.innerHTML = '<p class="text-gray-500 text-center mt-10">El carrito está vacío</p>';
                return;
            }

            cartContainer.innerHTML = '';
            carrito.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center border-b py-3";
                div.innerHTML = `
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800 text-sm leading-tight">${item.nombre}</h4>
                        <p class="text-blue-600 font-medium text-sm">$${item.precio.toLocaleString()}</p>
                    </div>
                    <div class="flex items-center space-x-2 bg-gray-100 rounded px-2 py-1">
                        <button onclick="cambiarCantidad(${index}, -1)" class="w-6 h-6 flex items-center justify-center font-bold text-gray-600 hover:text-gray-900">-</button>
                        <span class="font-medium text-sm w-4 text-center">${item.cantidad}</span>
                        <button onclick="cambiarCantidad(${index}, 1)" class="w-6 h-6 flex items-center justify-center font-bold text-gray-600 hover:text-gray-900" ${item.cantidad >= item.maxStock ? 'disabled' : ''}>+</button>
                    </div>
                    <button onclick="eliminarDelCarrito(${index})" class="ml-4 text-red-500 hover:text-red-700 p-1">🗑️</button>
                `;
                cartContainer.appendChild(div);
            });
        }

        function cambiarCantidad(index, delta) {
            const item = carrito[index];
            const nuevaCantidad = item.cantidad + delta;
            
            if (nuevaCantidad > 0 && nuevaCantidad <= item.maxStock) {
                item.cantidad = nuevaCantidad;
            } else if (nuevaCantidad <= 0) {
                eliminarDelCarrito(index);
                return;
            }
            actualizarUI();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Evitar scroll
            } else {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        async function realizarCompra() {
            if (carrito.length === 0) return;
            
            const btn = document.getElementById('btnComprar');
            const msg = document.getElementById('compraMensaje');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full mr-2"></span> Procesando...';
            
            try {
                // Formatear payload para VentaController
                const payload = carrito.map(item => ({
                    productoId: item.productoId,
                    cantidad: item.cantidad
                }));

                const response = await fetch('/api/ventas/comprar', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token 
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                msg.classList.remove('hidden');
                if (response.ok) {
                    msg.className = 'mt-3 text-center text-sm p-2 bg-green-100 text-green-700 rounded font-medium';
                    msg.textContent = `¡Compra exitosa! Total pagado: $${data.total.toLocaleString()}`;
                    carrito = [];
                    actualizarUI();
                    
                    // Recargar productos para actualizar stock
                    setTimeout(() => {
                        msg.classList.add('hidden');
                        toggleCart();
                        cargarProductos();
                    }, 3000);
                } else {
                    msg.className = 'mt-3 text-center text-sm p-2 bg-red-100 text-red-700 rounded font-medium';
                    msg.textContent = data.error || 'Error al procesar la compra';
                    btn.disabled = false;
                }
            } catch (error) {
                msg.classList.remove('hidden');
                msg.className = 'mt-3 text-center text-sm p-2 bg-red-100 text-red-700 rounded font-medium';
                msg.textContent = 'Error de red al procesar la compra';
                btn.disabled = false;
            } finally {
                if (btn.disabled === false) {
                    btn.innerHTML = 'Proceder al Pago';
                }
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }

        // Estilos CSS para animaciones
        const style = document.createElement('style');
        style.innerHTML = `
            .animate-slide-in { animation: slideIn 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1); }
            @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        `;
        document.head.appendChild(style);

        // Inicializar
        actualizarUI();
        
        cargarProductos();
    </script>
</body>
</html>
