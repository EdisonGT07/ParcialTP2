<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cliente')}"></head>
<body class="min-h-screen bg-slate-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:px-8">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="mb-6">
                <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Administración</p>
                <h1 class="text-3xl font-bold text-slate-800" th:text="${titulo}">Cliente</h1>
            </div>
            <form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post" class="space-y-5">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <div>
                    <label for="nombre" class="mb-1 block text-sm font-medium text-slate-700">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}" required minlength="2" maxlength="50" class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>
                <div>
                    <label for="correo" class="mb-1 block text-sm font-medium text-slate-700">Correo electrónico</label>
                    <input id="correo" type="email" th:field="*{correo}" required class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>
                <div>
                    <label for="fechaInscripcion" class="mb-1 block text-sm font-medium text-slate-700">Fecha de inscripción</label>
                    <input id="fechaInscripcion" type="date" th:field="*{fechaInscripcion}" required class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                </div>
                <div class="flex flex-wrap gap-3">
                    <button type="submit" class="inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Guardar cliente</button>
                    <a th:href="@{/cliente/listar}" class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
  </body>
</html>
