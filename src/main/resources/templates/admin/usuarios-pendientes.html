<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuarios pendientes')}"></head>
<body class="min-h-screen bg-slate-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Administración</p>
                    <h1 class="text-3xl font-bold text-slate-800">Usuarios pendientes</h1>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200 text-left text-sm text-slate-700">
                    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-600">
                    <tr>
                        <th class="px-4 py-3">Correo</th>
                        <th class="px-4 py-3">Estado</th>
                        <th class="px-4 py-3">Rol</th>
                        <th class="px-4 py-3">Acción</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                    <tr th:if="${usuarios.isEmpty()}">
                        <td colspan="4" class="px-4 py-8 text-center text-slate-500">No hay solicitudes pendientes.</td>
                    </tr>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="px-4 py-3" th:text="${usuario.username}">correo@ejemplo.com</td>
                        <td class="px-4 py-3">
                            <span class="rounded-full bg-yellow-100 px-2 py-1 text-xs font-semibold text-yellow-800" th:text="${usuario.estado}">PENDIENTE</span>
                        </td>
                        <td class="px-4 py-3">
                            <form th:action="@{/admin/usuarios/{id}/activar(id=${usuario.id})}" method="post" class="flex items-center gap-2">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                <select name="rol" class="rounded-md border border-slate-300 px-2 py-1.5 text-sm">
                                    <option value="CLIENTE">CLIENTE</option>
                                    <option value="ADMIN">ADMIN</option>
                                </select>
                                <button type="submit" class="inline-flex items-center rounded-lg bg-indigo-600 px-3 py-2 text-xs font-semibold text-white hover:bg-indigo-700">Activar</button>
                            </form>
                        </td>
                        <td class="px-4 py-3 text-slate-500">Pendiente</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
