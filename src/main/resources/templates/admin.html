<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <script th:src="@{/css/tailwind.js}"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <nav class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">Panel Admin</h1>
        <div>
            <a th:href="@{/producto/listar}" class="hover:text-gray-300 mr-4">Gestionar Productos</a>
            <a th:href="@{/cliente/listar}" class="hover:text-gray-300 mr-4">Gestionar Clientes</a>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Cerrar Sesión</button>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Solicitudes de Registro Pendientes</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-200 text-gray-700">
                        <tr>
                            <th class="py-3 px-4 text-left">ID</th>
                            <th class="py-3 px-4 text-left">Usuario</th>
                            <th class="py-3 px-4 text-left">Estado</th>
                            <th class="py-3 px-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes" class="text-gray-600 divide-y">
                        <!-- Llenado con JS -->
                    </tbody>
                </table>
                <div id="noData" class="text-center py-4 text-gray-500 hidden">No hay solicitudes pendientes.</div>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token || localStorage.getItem('role') !== 'ADMIN') {
            window.location.href = '/login';
        }

        async function cargarSolicitudes() {
            try {
                const res = await fetch('/api/admin/solicitudes', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.status === 401 || res.status === 403) {
                    logout();
                    return;
                }

                const usuarios = await res.json();
                const tbody = document.getElementById('tablaSolicitudes');
                const noData = document.getElementById('noData');
                
                tbody.innerHTML = '';
                
                if (usuarios.length === 0) {
                    noData.classList.remove('hidden');
                } else {
                    noData.classList.add('hidden');
                    usuarios.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition";
                        tr.innerHTML = `
                            <td class="py-3 px-4">${u.id}</td>
                            <td class="py-3 px-4 font-medium text-gray-800">${u.username}</td>
                            <td class="py-3 px-4"><span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded-full">${u.estado}</span></td>
                            <td class="py-3 px-4 text-center">
                                <button onclick="aprobar(${u.id})" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded mr-2 text-sm transition">Aprobar</button>
                                <button onclick="rechazar(${u.id})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">Rechazar</button>
                            </td>`;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Error al cargar:", error);
            }
        }

        async function aprobar(id) {
            await fetch(`/api/admin/solicitudes/${id}/aprobar?rol=CLIENTE`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            cargarSolicitudes();
        }

        async function rechazar(id) {
            await fetch(`/api/admin/solicitudes/${id}/rechazar`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            cargarSolicitudes();
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }

        cargarSolicitudes();
    </script>
</body>
</html>
