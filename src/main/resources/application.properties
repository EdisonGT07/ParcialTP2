spring.application.name=demo
spring.profiles.default=postgres
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection; configure DB_PASSWORD outside the repository.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comprasdb}
spring.datasource.username=${DB_USERNAME:compras_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

server.port=${PORT:8080}
server.servlet.session.timeout=30m
spring.thymeleaf.cache=false